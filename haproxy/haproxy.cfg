global
    log /dev/log local0
    maxconn 120000

defaults
    log global
    mode http
    timeout connect 10s
    timeout client 30s
    timeout server 30s

frontend http-in
    bind *:80
    default_backend webservers
    http-response set-header Cache-Control "no-cache, no-store, must-revalidate"
    http-response set-header Pragma "no-cache"
    http-response set-header Expires "0"

backend webservers
    balance roundrobin
    server golang golang:8080 check
    server nodejs nodejs:8080 check
    server java java:8080 check
    server csharp csharp:8080 check
    server python python:8080 check
    server python-flask python-flask:8080 check
    server perl perl:8080 check
    server rust rust:8080 check
    server lua lua:8080 check
    server c-web c-web:8080 check
    server cpp cpp:8080 check
